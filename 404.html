<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — DANILODEVSR // LABS</title>
  <meta name="description" content="Recurso no encontrado en DANILODEVSR // LABS" />

  <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --border: #000000;
      --text: #000000;
      --muted: #666666;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .container {
      max-width: 620px;
      width: 100%;
      background: var(--card-bg);
      border: 3px solid var(--border);
      box-shadow: 8px 8px 0px #000000;
      padding: 2.5rem 2rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      border: 1px solid var(--border);
      padding: 0.35rem 0.7rem;
      margin-bottom: 1.5rem;
      background: #000000;
      color: #FFFFFF;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FF4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .path-display {
      background: #EEEEEE;
      border-left: 3px solid var(--border);
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      margin-bottom: 2rem;
      word-break: break-all;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.4rem;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-decoration: none;
      border: 2px solid var(--border);
      background: #000000;
      color: #FFFFFF;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .btn:hover {
      background: #333333;
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0px #000000;
    }
    .btn-ghost {
      background: transparent;
      color: #000000;
    }
    .btn-ghost:hover {
      background: #EEEEEE;
    }
    .footer-note {
      margin-top: 2rem;
      font-size: 0.72rem;
      color: var(--muted);
      border-top: 1px dashed #CCCCCC;
      padding-top: 1rem;
    }
  </style>

  <script>
    // Enrutamiento inteligente para directorios huérfanos (/tools, /games, etc.)
    (function() {
      const path = window.location.pathname.replace(/\/$/, "");
      const map = {
        "/tools": "/?cat=tools#proyectos",
        "/games": "/?cat=games#proyectos",
        "/atlas": "/?cat=atlas#proyectos",
        "/experimental": "/?cat=experimental#proyectos"
      };
      if (map[path]) {
        window.location.replace(map[path]);
      }
    })();
  </script>
</head>
<body>
  <main class="container">
    <div class="badge mono">
      <span class="status-dot"></span>
      <span>HTTP 404 // ROUTE_NOT_FOUND</span>
    </div>

    <h1>RECURSO NO ENCONTRADO</h1>

    <p>
      La ruta solicitada no existe o ha sido reestructurada dentro de la suite modular de DANILODEVSR // LABS.
    </p>

    <div class="path-display mono" id="path-box">
      RUTA: <span id="current-path">...</span>
    </div>

    <div class="actions mono">
      <a href="/" class="btn">
        <span>VOLVER AL INICIO</span>
        <span>→</span>
      </a>
      <a href="/#proyectos" class="btn btn-ghost">
        <span>EXPLORAR CATÁLOGO</span>
        <span>↓</span>
      </a>
    </div>

    <div class="footer-note mono">
      DANILODEVSR // ZERO-INTERMEDIATES ARCHITECTURE & LOCAL-FIRST
    </div>
  </main>

  <script>
    document.getElementById("current-path").textContent = window.location.pathname || "/";
  </script>
</body>
</html>
