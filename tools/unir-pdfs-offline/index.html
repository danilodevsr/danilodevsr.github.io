<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PDFunify — Unificador de PDFs (Offline)</title>
  <link rel="stylesheet" href="../../styles.css" />
  <style>
    ul#list { list-style: none; padding: 0; margin-top: 14px; }
    ul#list li { display: flex; justify-content: space-between; gap: 10px; padding: 12px; border: 2px solid var(--border-color); margin-bottom: 8px; background: var(--bg-primary); }
    .name { max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 13px; }
    .actions { display: flex; gap: 6px; }
    button:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tool-header-bar">
      <div>
        <a class="tool-back-link" href="/?cat=tools#proyectos">← Volver al Catálogo</a>
      </div>
      <div>
        <span class="badge">DSR99 // TOOL-03</span>
      </div>
    </div>

    <div class="card">
      <h1 style="margin-top:0;">📄 PDFunify — Unificador de PDFs</h1>
      <p class="muted" style="margin-top:-6px; font-family: var(--font-mono); font-size: 13px;">
        100% Client-Side & Offline · Los documentos se procesan únicamente en la memoria de tu navegador.
      </p>

      <div class="row">
        <input id="files" type="file" accept="application/pdf" multiple class="btn" style="padding: 8px;" />
        <input id="outName" type="text" value="pdf_unido.pdf" style="max-width: 200px;" />
        <button id="mergeBtn" class="btn primary" disabled>Unir y descargar</button>
        <button id="clearBtn" class="btn" disabled>Limpiar</button>
      </div>
      <div id="status" class="muted" style="margin-top: 10px; font-family: var(--font-mono); font-size: 12px;"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0; font-family:var(--font-mono); text-transform:uppercase;">Orden de los PDFs</h3>
      <ul id="list"></ul>
    </div>
  </div>

<!-- LIBRERÍA OFFLINE -->
<script src="pdf-lib.min.js"></script>

<script>
const filesInput = document.getElementById('files');
const listEl = document.getElementById('list');
const mergeBtn = document.getElementById('mergeBtn');
const clearBtn = document.getElementById('clearBtn');
const statusEl = document.getElementById('status');
const outNameEl = document.getElementById('outName');

let files = [];

function refresh() {
  listEl.innerHTML = '';
  files.forEach((f, i) => {
    const li = document.createElement('li');

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = `${i + 1}. ${f.name}`;

    const actions = document.createElement('div');
    actions.className = 'actions';

    const up = document.createElement('button');
    up.textContent = '↑';
    up.disabled = i === 0;
    up.onclick = () => swap(i, i - 1);

    const down = document.createElement('button');
    down.textContent = '↓';
    down.disabled = i === files.length - 1;
    down.onclick = () => swap(i, i + 1);

    const del = document.createElement('button');
    del.textContent = 'Quitar';
    del.onclick = () => { files.splice(i, 1); refresh(); };

    actions.append(up, down, del);
    li.append(name, actions);
    listEl.appendChild(li);
  });

  mergeBtn.disabled = files.length < 2;
  clearBtn.disabled = files.length === 0;
  statusEl.textContent = files.length < 2
    ? 'Selecciona al menos 2 PDFs'
    : 'Listo para unir';
}

function swap(a, b) {
  [files[a], files[b]] = [files[b], files[a]];
  refresh();
}

filesInput.onchange = () => {
  files.push(...Array.from(filesInput.files));
  filesInput.value = '';
  refresh();
};

clearBtn.onclick = () => {
  files = [];
  refresh();
};

mergeBtn.onclick = async () => {
  mergeBtn.disabled = true;
  statusEl.textContent = 'Uniendo PDFs...';

  const { PDFDocument } = PDFLib;
  const merged = await PDFDocument.create();

  for (const f of files) {
    const bytes = await f.arrayBuffer();
    const pdf = await PDFDocument.load(bytes);
    const pages = await merged.copyPages(pdf, pdf.getPageIndices());
    pages.forEach(p => merged.addPage(p));
  }

  const outBytes = await merged.save();
  const blob = new Blob([outBytes], { type: 'application/pdf' });

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = outNameEl.value.endsWith('.pdf') ? outNameEl.value : outNameEl.value + '.pdf';
  a.click();

  URL.revokeObjectURL(a.href);
  statusEl.textContent = 'PDF unido descargado ✅';
  refresh();
};

refresh();
</script>
</body>
</html>
