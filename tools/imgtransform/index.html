<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Convertir / Redimensionar Imagen</title>
  <style>
/* --- DSR99 SWISS DESIGN SYSTEM (INLINED) --- */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

/* ============================================================
   🎨 DANILODEVSR GLOBAL STYLESHEET
   1. Base & Tokens Suizos para Herramientas y Subproyectos (/tools/, /games/)
   2. Sistema de Diseño Editorial Suizo para la Landing Page
   ============================================================ */

:root {
  /* Paleta Base Unificada (DSR99 Neo-Brutalismo Suizo) */
  --bg: #F7F7F8;
  --bg-primary: #FFFFFF;
  --bg-secondary: #F7F7F8;
  --bg-hover: #EFEFEF;
  --card: #FFFFFF;
  --bg-card: #FFFFFF;
  --text: #000000;
  --text-primary: #000000;
  --text-secondary: #4B5563;
  --muted: #4B5563;
  --accent: #000000;
  --border-color: #000000;
  --border-default: #000000;
  --border-mid: #000000;
  --border-hover: #000000;
  --border-light: #E5E7EB;
  --border-subtle: #D1D5DB;
  --focus-ring: rgba(0, 0, 0, 0.15);
  --shadow-card: 4px 4px 0px #000000;
  --shadow-brutal: 3px 3px 0px var(--border-color);
  --shadow-brutal-lg: 5px 5px 0px var(--border-color);
  --shadow-brutal-hover: 6px 6px 0px var(--border-color);
  --radius: 0px;
  --radius-sm: 0px;
  --spacing: 24px;
  --max-width: 1120px;
  --font-sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', "SF Mono", Consolas, monospace;
}

/* ============================================================
   🧩 BASE & RESET
   ============================================================ */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   🛠️ UTILIDADES Y LAYOUT SUIZO PARA HERRAMIENTAS (/tools/)
   ============================================================ */
.wrap { 
  max-width: 1000px; 
  margin: 32px auto; 
  padding: 0 1.5rem; 
}

.hr { 
  height: 2px; 
  background: var(--border-default); 
  margin: 20px 0; 
}

.muted { color: var(--muted); }
.hide { display: none; }

/* Grid de herramientas */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
.col-12 { grid-column: span 12; }
.col-6 { grid-column: span 6; }
.col-4 { grid-column: span 4; }
@media (max-width: 720px) { .col-6, .col-4 { grid-column: span 12; } }
.grid.auto { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

/* Tarjetas y Contenedores Suizos */
.card {
  background: var(--card);
  border: 2px solid var(--border-default);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow-card);
  margin-bottom: 24px;
}

.tool-header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--border-color);
  padding: 1rem 0;
  margin-bottom: 2rem;
}

.tool-back-link {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 0.8rem;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  box-shadow: 2px 2px 0 var(--border-color);
  transition: all 0.15s ease;
}

.tool-back-link:hover {
  background: var(--border-color);
  color: var(--bg-primary);
  transform: translate(-1px, -1px);
  box-shadow: 3px 3px 0 var(--border-color);
}

.badge { 
  display: inline-block; 
  font-family: var(--font-mono);
  font-size: 11px; 
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text); 
  border: 1px solid var(--border-color);
  padding: 2px 6px;
  background: var(--bg-secondary);
}

/* Controles de formulario Suizos */
label { 
  display: block; 
  font-family: var(--font-mono);
  font-size: 13px; 
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text); 
  margin: 8px 0 4px; 
}

input[type="text"], 
input[type="number"], 
input[type="search"], 
input[type="date"],
input.search, 
select, 
textarea {
  width: 100%; 
  padding: 12px 14px; 
  border-radius: var(--radius-sm);
  border: 2px solid var(--border-mid); 
  background: var(--bg-primary);
  color: var(--text); 
  font-family: var(--font-mono);
  font-size: 14px;
  outline: none;
  transition: all .15s ease;
}

input:focus, select:focus, textarea:focus { 
  border-color: var(--border-color); 
  box-shadow: 3px 3px 0px var(--border-color); 
}

/* Botones Suizos */
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

.btn {
  appearance: none; 
  border: 2px solid var(--border-hover);
  background: var(--bg-primary); 
  color: var(--text);
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 14px;
  border-radius: var(--radius-sm); 
  padding: 10px 16px; 
  cursor: pointer;
  box-shadow: var(--shadow-brutal);
  transition: all .15s ease;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn:hover { 
  transform: translate(-1px, -1px); 
  box-shadow: var(--shadow-brutal-hover);
  background: var(--border-color);
  color: var(--bg-primary);
}

.btn:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0px var(--border-color);
}

.btn.primary { 
  background: var(--border-color); 
  color: var(--bg-primary); 
  border-color: var(--border-color); 
}

.btn.primary:hover {
  background: #222222;
  color: var(--bg-primary);
  transform: translate(-1px, -1px);
}

.btn-outline { 
  background: transparent; 
}

.btn-link { 
  border: 0; 
  padding: 0; 
  color: var(--text); 
  font-family: var(--font-mono);
  text-decoration: underline; 
  font-weight: 600;
}
.btn-link:hover { text-decoration: underline; }

/* Resultados / Stats para calculadoras */
.results { display: grid; gap: 10px; grid-template-columns: repeat(12, 1fr); }
.stat {
  grid-column: span 3;
  background: var(--bg-hover);
  border: 1px solid var(--border-default);
  padding: 14px; border-radius: 14px;
}
.stat h3 {
  margin: 0 0 6px; font-size: 12px; letter-spacing: .04em;
  color: var(--muted); text-transform: uppercase;
}
.stat .val { font-size: 20px; font-weight: 700; color: #ffffff; }
@media (max-width: 900px) { .stat { grid-column: span 6; } }
@media (max-width: 520px) { .stat { grid-column: span 12; } }

.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  display: inline-block; font-size: 12px; line-height: 1;
  color: #cbd5e1; border: 1px solid var(--border-default);
  padding: 4px 8px; border-radius: 999px; background: var(--bg-hover);
}


/* ============================================================
   🏛️ SISTEMA DE DISEÑO SUIZO — LANDING PAGE (body.landing-page)
   ============================================================ */
body.landing-page {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

body.landing-page a { color: inherit; text-decoration: none; }

.mono { font-family: var(--font-mono); }
.uppercase { text-transform: uppercase; letter-spacing: 0.04em; }

.container {
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 1.5rem;
}

/* Header Landing */
body.landing-page header {
  border-bottom: 2px solid var(--border-color);
  background: var(--bg-primary);
  position: sticky;
  top: 0;
  z-index: 100;
  margin-bottom: 0;
}

.nav-wrapper {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.25rem 0;
  gap: 1rem;
}

.brand-wrap { display: flex; align-items: center; gap: 1.25rem; }
.brand {
  font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em;
  display: flex; align-items: center; gap: 0.4rem;
}
.brand-dot { width: 8px; height: 8px; background: var(--border-color); display: inline-block; }

.status-badge {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font-size: 0.72rem; font-weight: 600;
  border: 1px solid var(--border-color);
  padding: 0.25rem 0.65rem; background: var(--bg-secondary);
}
.status-dot {
  width: 7px; height: 7px; background-color: #10b981;
  border-radius: 50%; animation: pulse-dot 2s infinite ease-in-out;
}
@keyframes pulse-dot {
  0% { transform: scale(0.9); opacity: 0.8; }
  50% { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(0.9); opacity: 0.8; }
}

.nav-links { display: flex; align-items: center; gap: 1.5rem; font-size: 0.78rem; font-weight: 600; }
.nav-link {
  color: var(--text-secondary); border-bottom: 2px solid transparent;
  padding-bottom: 2px; transition: all 0.15s ease;
}
.nav-link:hover { color: var(--text-primary); border-color: var(--border-color); }

.nav-btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.4rem 0.85rem; background: var(--border-color);
  color: var(--bg-primary) !important; font-weight: 700;
  border: 1px solid var(--border-color);
  box-shadow: 2px 2px 0px rgba(0,0,0,0.25);
  transition: all 0.15s ease;
}
.nav-btn:hover {
  transform: translateY(-1px);
  box-shadow: 3px 3px 0px var(--border-color);
  color: var(--bg-primary) !important;
}

/* Bitstream Audio Visualizer */
.bitstream-bar {
  width: 100%;
  height: 34px;
  background-color: var(--bg-secondary);
  border-bottom: 2px solid var(--border-color);
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
}
.bitstream-canvas { width: 100%; height: 100%; display: block; }

/* Hero Landing */
.hero-section {
  padding: 4.5rem 0 3.5rem;
  border-bottom: 2px solid var(--border-color);
}
.hero-tag {
  display: inline-block; font-size: 0.75rem; font-weight: 700;
  background: var(--text-primary); color: var(--bg-primary);
  padding: 0.3rem 0.65rem; margin-bottom: 1.75rem;
}
.hero-title {
  font-size: clamp(2.8rem, 8vw, 5.8rem); font-weight: 700;
  line-height: 0.95; letter-spacing: -0.04em; margin-bottom: 1.75rem;
  max-width: 980px;
}
.hero-subtitle {
  font-size: clamp(1.05rem, 1.8vw, 1.25rem); color: var(--text-secondary);
  max-width: 720px; line-height: 1.55; font-weight: 500; margin-bottom: 2.25rem;
}
.hero-actions { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }

.btn-brutal {
  display: inline-flex; align-items: center; gap: 0.6rem;
  font-size: 0.85rem; font-weight: 700; padding: 0.9rem 1.6rem;
  border: 2px solid var(--border-color); background: var(--text-primary);
  color: var(--bg-primary) !important; box-shadow: var(--shadow-brutal);
  cursor: pointer; transition: all 0.15s ease;
}
.btn-brutal:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-brutal-hover); }
.btn-brutal.btn-ghost { background: var(--bg-primary); color: var(--text-primary) !important; }
.btn-brutal.btn-ghost:hover { background: var(--bg-secondary); }

/* Specs Bar */
.specs-bar-section {
  border-bottom: 2px solid var(--border-color);
  background: var(--bg-secondary);
}
.specs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.spec-item { padding: 1.4rem 1.25rem; border-right: 1px solid var(--border-color); }
.spec-item:last-child { border-right: none; }
.spec-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0.35rem; }
.spec-value { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }

/* Featured Section */
.featured-section { padding: 4.5rem 0; border-bottom: 2px solid var(--border-color); }
.section-head-wrap {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 2.25rem; padding-bottom: 0.75rem; border-bottom: 2px solid var(--border-color);
}
.section-tag { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; margin-bottom: 0.3rem; display: block; }
.section-title { font-size: clamp(1.5rem, 3.5vw, 2.2rem); font-weight: 700; letter-spacing: -0.03em; }
.section-count { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); }

.featured-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.75rem; }
.featured-card {
  background: var(--bg-card); border: 2px solid var(--border-color);
  padding: 1.75rem; box-shadow: var(--shadow-brutal); display: flex;
  flex-direction: column; justify-content: space-between; transition: all 0.15s ease;
}
.featured-card:hover { transform: translate(-3px, -3px); box-shadow: var(--shadow-brutal-hover); }

.f-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
.f-card-id { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }
.f-card-category {
  font-size: 0.7rem; font-weight: 700; border: 1px solid var(--border-color);
  padding: 0.2rem 0.5rem; background: var(--bg-secondary);
}
.f-card-title { font-size: 1.35rem; font-weight: 700; line-height: 1.2; margin-bottom: 0.75rem; letter-spacing: -0.02em; }
.f-card-desc { color: var(--text-secondary); font-size: 0.92rem; line-height: 1.5; margin-bottom: 1.5rem; }
.f-card-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
.f-card-tag { font-size: 0.7rem; background: var(--bg-secondary); border: 1px solid var(--border-light); padding: 0.2rem 0.5rem; font-weight: 500; }
.f-card-footer { padding-top: 1.25rem; border-top: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
.f-card-link { font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.4rem; }
.f-card-link:hover { text-decoration: underline; }

/* Catalog Section */
.catalog-section { padding: 5rem 0; background: var(--bg-secondary); border-bottom: 2px solid var(--border-color); }
.catalog-toolbar {
  background: var(--bg-primary); border: 2px solid var(--border-color);
  padding: 1.5rem; margin-bottom: 2.5rem; box-shadow: var(--shadow-brutal);
}
.search-box-wrap {
  display: flex; align-items: stretch; border: 2px solid var(--border-color);
  background: var(--bg-primary); margin-bottom: 1.25rem;
}
.search-label {
  background: var(--border-color); color: var(--bg-primary); padding: 0.85rem 1.15rem;
  font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; white-space: nowrap;
}
.search-input {
  width: 100%; border: none; padding: 0.85rem 1rem;
  font-family: var(--font-mono); font-size: 0.88rem; outline: none; background: transparent; color: #000000;
}
.filter-pills { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.filter-btn {
  background: var(--bg-secondary); border: 1px solid var(--border-color);
  padding: 0.4rem 0.85rem; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600;
  cursor: pointer; transition: all 0.12s ease; color: #000000;
}
.filter-btn:hover { background: #E5E7EB; }
.filter-btn.active { background: var(--border-color); color: var(--bg-primary); }

.projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.5rem; }
.project-card {
  background: var(--bg-card); border: 2px solid var(--border-color);
  padding: 1.35rem; box-shadow: 2px 2px 0px var(--border-color);
  display: flex; flex-direction: column; justify-content: space-between; transition: all 0.15s ease;
}
.project-card:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-brutal-hover); }
.p-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; }
.p-card-id { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); }
.p-card-emoji { font-size: 1.25rem; line-height: 1; }
.p-card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.02em; color: #000000; }
.p-card-desc { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.45; margin-bottom: 1.15rem; flex-grow: 1; }
.p-card-tags { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.p-card-tag { font-size: 0.68rem; background: var(--bg-secondary); border: 1px solid var(--border-light); padding: 0.2rem 0.45rem; color: var(--text-secondary); }
.p-card-action {
  display: inline-flex; align-items: center; justify-content: space-between;
  padding: 0.6rem 0.85rem; background: var(--bg-secondary); border: 1px solid var(--border-color);
  font-size: 0.78rem; font-weight: 700; transition: all 0.12s ease; color: #000000;
}
.p-card-action:hover { background: var(--border-color); color: var(--bg-primary) !important; }

.empty-state {
  grid-column: 1 / -1; background: var(--bg-primary); border: 2px dashed var(--border-color);
  padding: 3rem 1.5rem; text-align: center; color: #000000;
}
.empty-state h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
.empty-state p { color: var(--text-muted); font-size: 0.85rem; }

/* Footer Landing */
body.landing-page footer {
  border-top: 2px solid var(--border-color);
  background: var(--bg-primary);
  padding: 3.5rem 0 2rem;
  margin-top: auto;
}
.footer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 2rem; flex-wrap: wrap; margin-bottom: 2.5rem; }
.footer-brand { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; color: #000000; }
.footer-desc { font-size: 0.85rem; color: var(--text-secondary); max-width: 440px; }
.footer-specs-list { display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.78rem; color: var(--text-secondary); }
.footer-bottom {
  border-top: 1px solid var(--border-light); padding-top: 1.5rem;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.75rem; color: var(--text-muted); flex-wrap: wrap; gap: 1rem;
}

@media (max-width: 768px) {
  .nav-links { display: none; }
  .hero-section { padding: 3rem 0 2.5rem; }
  .specs-grid { grid-template-columns: 1fr 1fr; }
  .spec-item { border-bottom: 1px solid var(--border-color); }
  .featured-grid { grid-template-columns: 1fr; }
  .projects-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="tool-header-bar">
      <div>
        <a class="tool-back-link" href="/?cat=tools#proyectos">← Volver al Catálogo</a>
      </div>
      <div>
        <span class="badge">DSR99 // TOOL-02</span>
      </div>
    </div>

    <div class="card">
      <h1 style="margin-top:0;">🖼️ ImgTransform</h1>
      <p class="muted" style="margin-top:-6px; font-family: var(--font-mono); font-size: 13px;">
        Carga una imagen, elige un preset de tamaño o formato y descárgala optimizada client-side.
      </p>

      <!-- Controles -->
      <div class="row" style="margin-bottom:10px;">
        <input type="file" id="fileInput" accept="image/*" class="btn" />
        <span class="muted" id="fileMeta">Sin archivo</span>
      </div>

      <div class="grid">
        <div class="col-6">
          <label for="preset">Preset de tamaño</label>
          <select id="preset" class="btn" style="width:100%;">
            <option value="">— Selecciona un preset —</option>
            <option value="1080x1920">Reel / Story (1080×1920)</option>
            <option value="1080x1080">Post cuadrado IG (1080×1080)</option>
            <option value="1200x1600">Portrait web (1200×1600)</option>
            <option value="1920x1080">Hero 16:9 (1920×1080)</option>
            <option value="1920x800">Hero ancho (1920×800)</option>
            <option value="1600x1600">Producto e-commerce (1600×1600)</option>
            <option value="1280x720">Thumbnail 16:9 (1280×720)</option>
            <option value="original">Mantener tamaño original</option>
          </select>
        </div>

        <div class="col-6">
          <label for="format">Formato de salida</label>
          <div class="row">
            <select id="format" class="btn">
              <option value="image/jpeg">JPG</option>
              <option value="image/png">PNG</option>
              <option value="image/webp">WEBP</option>
            </select>

            <label class="muted" for="quality" style="margin-left:6px;">Calidad</label>
            <input id="quality" type="range" min="0.5" max="1" step="0.05" value="0.9" />
            <span class="muted" id="qualityVal">0.90</span>
          </div>
        </div>
      </div>

      <div class="row" style="margin-top:10px;">
        <button id="generateBtn" class="btn primary" disabled>Generar</button>
        <button id="downloadBtn" class="btn" disabled>Descargar</button>
      </div>

      <div id="preview" style="margin-top:16px"></div>
      <canvas id="canvas" style="display:none;"></canvas>

      <div class="footer">
        El proceso es 100% local — tu imagen no se sube a ningún servidor.
      </div>
    </div>
  </div>

  <script>
    const input   = document.getElementById('fileInput');
    const preset  = document.getElementById('preset');
    const format  = document.getElementById('format');
    const quality = document.getElementById('quality');
    const qVal    = document.getElementById('qualityVal');
    const genBtn  = document.getElementById('generateBtn');
    const dlBtn   = document.getElementById('downloadBtn');
    const meta    = document.getElementById('fileMeta');
    const preview = document.getElementById('preview');
    const canvas  = document.getElementById('canvas');
    const ctx     = canvas.getContext('2d');

    let img = new Image();
    let fileName = '';
    let fileType = '';

    // Mostrar calidad numérica
    quality.addEventListener('input', () => qVal.textContent = Number(quality.value).toFixed(2));

    // Habilitar Generar solo si hay archivo + preset
    function toggleGenerate() {
      genBtn.disabled = !(input.files?.length && preset.value);
      dlBtn.disabled  = true;
    }

    input.addEventListener('change', () => {
      const f = input.files?.[0];
      if (!f) { meta.textContent = 'Sin archivo'; toggleGenerate(); return; }

      fileName = f.name;
      fileType = f.type || 'image/*';

      // Mostrar metadata
      const ext = (fileName.split('.').pop() || '').toLowerCase();
      meta.textContent = `Archivo: ${fileName} • tipo: ${fileType || ext}`;

      // Cargar imagen
      const reader = new FileReader();
      reader.onload = e => { img.src = e.target.result; };
      reader.readAsDataURL(f);

      img.onload = () => {
        preview.innerHTML = `
          <p class="muted">Vista previa (original: ${img.width}×${img.height})</p>
          <img src="${img.src}" style="max-width:260px;border-radius:8px;border:1px solid #1f2937" />
        `;
      };

      // Sugerir formato por defecto
      if (ext === 'png') format.value = 'image/png';
      else if (ext === 'webp') format.value = 'image/webp';
      else format.value = 'image/jpeg';

      toggleGenerate();
    });

    preset.addEventListener('change', toggleGenerate);

    // Utilidad: draw cover centrado (recorta para llenar el lienzo)
    function drawCover(image, targetW, targetH) {
      const iw = image.width, ih = image.height;
      const scale = Math.max(targetW / iw, targetH / ih);
      const dw = iw * scale, dh = ih * scale;
      const dx = (targetW - dw) / 2;
      const dy = (targetH - dh) / 2;
      ctx.clearRect(0, 0, targetW, targetH);
      ctx.drawImage(image, dx, dy, dw, dh);
    }

    // Generar
    genBtn.addEventListener('click', () => {
      if (!input.files?.length || !preset.value) return;

      let outW, outH;

      if (preset.value === 'original') {
        outW = img.width;
        outH = img.height;
        canvas.width = outW;
        canvas.height = outH;
        ctx.clearRect(0, 0, outW, outH);
        ctx.drawImage(img, 0, 0, outW, outH);
      } else {
        const [w, h] = preset.value.split('x').map(Number);
        outW = w; outH = h;
        canvas.width = outW;
        canvas.height = outH;
        drawCover(img, outW, outH);
      }

      // Previsualizar resultado
      const dataURL = canvas.toDataURL(format.value, Number(quality.value));
      preview.innerHTML = `
        <p class="muted">Resultado: ${outW}×${outH} (${format.value.replace('image/','').toUpperCase()})</p>
        <img src="${dataURL}" style="max-width:320px;border-radius:8px;border:1px solid #1f2937" />
      `;

      dlBtn.disabled = false;
      dlBtn.onclick = () => {
        canvas.toBlob((blob) => {
          const ext = format.value.split('/')[1] || 'jpg';
          const nameBase = fileName.replace(/\\.[^.]+$/, '');
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `${nameBase}_${outW}x${outH}.${ext}`;
          a.click();
          URL.revokeObjectURL(a.href);
        }, format.value, Number(quality.value));
      };
    });
  </script>
</body>
</html>
